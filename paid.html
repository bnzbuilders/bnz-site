<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're in — BuildWithBNZ</title>
<meta name="theme-color" content="#c9a227">
<style>
  :root { --bg:#0f1115; --text:#f3f0e7; --muted:#9a9588; --gold:#c9a227; --line:#2a2f3a; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 2.2rem; letter-spacing: -.02em; }
  p { color: var(--muted); }
  a.btn { display: inline-block; background: var(--gold); color: #111; border-radius: 999px; padding: 12px 18px; font-weight: 700; text-decoration: none; margin-top: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <p style="color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:600;">Stripe</p>
    <h1>Paid. You're on the crew.</h1>
    <p>Stripe emailed the receipt. Sara / Full crew access gets unlocked from the desk after the payment lands.</p>
    <p id="echo"></p>
    <a class="btn" href="/crew/">Open the crew desk</a>
  </div>
  <script>
    try {
      var row = JSON.parse(localStorage.getItem("bnz_checkout") || "null");
      if (row) {
        document.getElementById("echo").textContent = row.name + " · " + row.company + " · " + row.plan;
        row.status = "PAID";
        row.paidAt = new Date().toISOString();
        localStorage.setItem("bnz_checkout", JSON.stringify(row));
      }
    } catch (e) {}
  </script>
</body>
</html>
